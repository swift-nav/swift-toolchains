---
name: musl
on:
  pull_request:
    paths:
      - "musl/**"
      - .github/workflows/musl.yaml
  push:
    tags:
      - "musl-cross-*"

permissions:
  contents: read

jobs:
  toolchains:
    strategy:
      matrix:
        target: [aarch64-linux-musl, arm-linux-musleabihf, x86_64-linux-musl]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    name: ${{ matrix.target }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ${{ matrix.target }}
        run: make ${{ matrix.target }}

      - name: Upload release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "${{ matrix.target }}-cross.tar.gz*"
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

